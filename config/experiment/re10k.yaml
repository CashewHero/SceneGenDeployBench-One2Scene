# @package _global_

defaults:
  - /dataset@_group_.re10k: cube
  # - override /model/encoder: noposplat
  # - override /model/encoder/backbone: croco
  - override /model/encoder: fastsplat
  - override /model/encoder/backbone: fast3r
  - override /loss: [mse, lpips]

wandb:
  name: re10k
  tags: [re10k, 256x256]

model:
  encoder:
    gs_params_head_type: dpt_gs
    pose_free: false
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: "/home/pengfei_wang/NoPoSplat/outputs/exp_cube_vggt/2025-04-25_13-33-50/checkpoints/epoch_0-step_30000.ckpt"
  decoder:
    make_scale_invariant: true

dataset:
  re10k:
    view_sampler:
      warm_up_steps: 1250

optimizer:
  lr: 1e-4
  warm_up_steps: 125
  backbone_lr_multiplier: 0.1

data_loader:
  train:
    batch_size: 2

trainer:
  max_steps: 50001
  val_check_interval: 100

checkpointing:
  every_n_train_steps: 5000
  save_top_k: -1