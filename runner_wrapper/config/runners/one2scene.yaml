catalog_version: 1

runners:
  - runner: one2scene-scaffold
    version: 0.1.1
    latest: true
    display_name: One2Scene Scaffold
    kind: generator
    contract_version: 1
    inputs:
      data:
        required_sample:
          required_datatype:
            - image
    job_parameters:
      # The upstream demo uses 512. Set 256 for a faster, lower-memory run.
      cube_size: 512
    scheduling:
      # The server starts a fresh child process for each job, which bounds model and CUDA state lifetime.
      max_batch_size: 10
      # Retry one transient checkpoint-download, container, or GPU failure.
      max_attempts: 2
      job_timeout_minutes: 60
      startup_timeout_minutes: 5
    launcher:
      driver: docker
      compat_version: 1
      image: ghcr.io/cashewhero/scenegendeploybench-one2scene:0.1.1
      # One panorama does not benefit from upstream data-parallel DDP. Run one instance per GPU.
      gpus: 1
      endpoint:
        port: 58090
      env:
        HF_HOME: /data/model_cache/one2scene/huggingface
        TORCH_HOME: /data/model_cache/one2scene/torch
        XDG_CACHE_HOME: /data/model_cache/one2scene/xdg
        HF_HUB_DISABLE_XET: "1"
        PYTORCH_ALLOC_CONF: expandable_segments:True
        RUNNER_ADAPTER: runner_wrapper.adapter:run_job
      env_passthrough:
        - HF_TOKEN
