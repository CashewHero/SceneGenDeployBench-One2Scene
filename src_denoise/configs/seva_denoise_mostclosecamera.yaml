# cancat source noised view in token space
# source noised view use lora attention to process exclusively
VERSION_DICT:
  H: 512
  W: 512
  T: 21 # ten images
  C: 4
  f: 8  
  options:
    chunk_strategy: nearest-gt
    video_save_fps: 30.0
    beta_linear_start: 5e-6
    log_snr_shift: 2.4
    guider_types: 1
    cfg: 1.0 # 2.0
    camera_scale: 2.0
    num_steps: 50
    cfg_min: 1.0 # 1.2
    encoding_t: 1
    decoding_t: 1
    num_inputs: None
    seed: 23


model:
  base_learning_rate: 1e-5
  target: seva.model_engine_denoise_mostclosecamera.SevaEngine
  params:
    ucg_rate: 0.0
    save_dir: "../demo_outputs/render_denoise"
    
    disable_first_stage_autocast: False
    log_keys:
      - txt
    VERSION_DICT: ${VERSION_DICT}
    test_data_config: ${test_data}

    # loss_weight: 10.0 
    loss_weighting_config:
      target: sgm.modules.diffusionmodules.loss_weighting.EpsWeighting

    sigma_sampler_config:  
      target: sgm.modules.diffusionmodules.sigma_sampling.DiscreteSampling
      params:
        num_idx: 1000
        discretization_config:
          # target: sgm.modules.diffusionmodules.discretizer.LegacyDDPMDiscretization # 这是错误的，因为SEVA有snr_shift的
          target: seva.sampling.DDPMDiscretization

    # sampler_config: #  SEVA没用到，直接在init中创建
    #   target: sgm.modules.diffusionmodules.sampling.EulerEDMSampler
    #   params:
    #     num_steps: 50

    #     discretization_config:
    #       target: sgm.modules.diffusionmodules.discretizer.LegacyDDPMDiscretization

    #     guider_config:
    #       target: sgm.modules.diffusionmodules.guiders.VanillaCFG
    #       params:
    #         scale: 7.5

    scheduler_config: # 用于训练学习率
      target: sgm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [0]
        cycle_lengths: [10000000000000]
        f_start: [1.e-6]
        f_max: [1.]
        f_min: [1.]

    baseline_denoiser_config:
      target: seva.sampling.DiscreteDenoiser
      params:
        num_idx: 1000
        device: cuda
        discretization_config:            
          target: seva.sampling.DDPMDiscretization

    denoiser_config: 
      target: seva.sampling.DiscreteDenoiser
      params:
        num_idx: 1000
        device: cuda
        discretization_config:            
          target: seva.sampling.DDPMDiscretization

    network_config:
      target: sgm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        use_checkpoint: True
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [1, 2, 4]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 64
        num_classes: sequential
        adm_in_channels: 1792
        num_heads: 1
        transformer_depth: 1
        context_dim: 768
        spatial_transformer_attn_type: softmax-xformers

    conditioner_config: # 没用到,在init中初始化
      target: sgm.modules.GeneralConditioner
      params:
        emb_models:
          - is_trainable: False
            input_key: txt
            ucg_rate: 0.1
            legacy_ucg_value: ""
            target: sgm.modules.encoders.modules.FrozenCLIPEmbedder
            params:
              always_return_pooled: True

          - is_trainable: False
            ucg_rate: 0.1
            input_key: original_size_as_tuple
            target: sgm.modules.encoders.modules.ConcatTimestepEmbedderND
            params:
              outdim: 256

          - is_trainable: False
            input_key: crop_coords_top_left
            ucg_rate: 0.1
            target: sgm.modules.encoders.modules.ConcatTimestepEmbedderND
            params:
              outdim: 256

    first_stage_config:
      target: sgm.models.autoencoder.AutoencoderKL
      params:
        ckpt_path: ./sdxl-vae/sdxl_vae.safetensors
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          attn_type: vanilla-xformers
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    loss_fn_config: # 用于训练损失函数
      target: sgm.modules.diffusionmodules.loss.StandardDiffusionLoss
      params:
        loss_weighting_config:
          target: sgm.modules.diffusionmodules.loss_weighting.EpsWeighting
        sigma_sampler_config:
          target: sgm.modules.diffusionmodules.sigma_sampling.DiscreteSampling 
          params:
            num_idx: 1000

            discretization_config:
              # target: sgm.modules.diffusionmodules.discretizer.LegacyDDPMDiscretization # 这是错误的，因为SEVA有snr_shift的
              target: seva.sampling.DDPMDiscretization



data:
  target: seva.seva_dataset_denoise_train.SEVADataset_DenoiseOnline
  params:
    VERSION_DICT: ${VERSION_DICT}
    # Example: datafolder: /path/to/mvsplat360_noisyimg960p
    datafolder: 'PATH_TO_TRAIN_DATA'
    max_cond_views: 1
    min_cond_views: 1
    num_cond_noisy_view: 8
    num_cond_clear_view: 5
    num_target_view: 8

